[project]
name = "models"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["build123d>=0.13", "fullcontrol", "shapely>=2.1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.uv.sources]
fullcontrol = { git = "https://github.com/FullControlXYZ/fullcontrol" }
